phase: test
distortion: inpaint
wandb_mode: online
run_name: fixed
#jobid: TEST_ # for wandb
log_dir: logs
display_on_inference: 50
# Those are controlled via the bash script now
# K: 0
# H: 0.5
# norm: false
# max_diffusivity: 0.2
inference_steps: 100
diffusivity_schedule: fbb

sde:
  lambda_square: 30
  T: 100
  schedule: cosine # linear, cosine time embedding?
  eps: 0.005

# params for the model architecture UNet imagerec
network_G:
  which_model_G: ConditionalUNet
  setting:
    in_nc: 3
    out_nc: 3
    nf: 64
    depth: 4

# in train_eval script the model is given by the script:
#pretrain_model_G: "/data/cluster/users/belova/projects/sbalign/aligned_diffusion_bridges/logs/74591-K-0-H-0.5-norm-False-g-0.2/best_model.pt"
