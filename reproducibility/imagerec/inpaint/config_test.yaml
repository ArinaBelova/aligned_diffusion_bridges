datasets:
  eval:
    name: Eval_Dataset
    mode: LQGT
    dataroot_GT: celebahq256_imgs/valid/ #train
    dataroot_LQ: celebahq256_imgs/masks/thin
    # we don;t use this transformation in eval, just need it for compatability
    GT_size: ~
    LR_size: ~
    only_get_LQ: false
    only_get_GT: false
    common_shape: 256
