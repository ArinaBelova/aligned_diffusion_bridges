latent: true
phase: test
distortion: derain
wandb_mode: online
run_name: fixed
#jobid: TEST_ # for wandb
log_dir: logs

# Those are controlled via the bash script now
# K: 0
# H: 0.5
# norm: false
# max_diffusivity: 0.2
inference_steps: 100
diffusivity_schedule: fbb

sde:
  lambda_square: 30
  T: 100
  schedule: cosine # linear, cosine time embedding?
  eps: 0.005

# params for the model architecture UNet imagerec
network_G:
  which_model_G: ConditionalUNet
  setting:
    in_nc: 16
    out_nc: 16
    nf: 64
    depth: 4

vae_checkpoint_path: /data/cluster/users/belova/projects/sbalign/aligned_diffusion_bridges/imagerec/models/ckpt_step_50000.pt

# in train_eval script the model is given by the script:
