latent: true
phase: train
task: imagerec
distortion: derain # inpaint # experiment distortion for imagerec framework 
#is_train: true

data_dir: sbalign/data
dist: false # distributed training
gpu_ids: 0

diffusivity_schedule: fbb 
#distance_embed_dim: 32
drift_weight: 1.0
dropout_p: 0.2
early_stop_goal: min
early_stop_metric: val_loss
ema_decay_rate: 0.8
grad_clip_value: 1.0 # maybe too large 5.0 ?
inference_every: 400 #400 #50 #400
inference_goal: max
inference_metric: val_inference_avg_psnr_y # based on this metric we will save the best_model.pth
inference_steps: 100
display_on_inference: 10 # as we have lots of images in test we don't want to display them all during validation
log_dir: logs
lr: 0.0001 #0.001

# Those are controlled via the bash script now
#max_diffusivity: 0.25 # needs to be tuned for every use case, for proteins we used 0.25
# H,K,norm come from the cmd and parsed in setup.py
#H: 0.5
#K: 0 #5
#norm: false #true

n_epochs: 4000 #4000 #300 #4000 #2000 #300 #300  #300 #200 #10000
num_workers: 1
optim_name: adamw
#reg_weight_T: 1.0
#reg_weight_t: 10.0
run_name: fixed #CONF_TP_MODEL-gia1ordl
scheduler: onecycle
scheduler_mode: min
scheduler_patience: 50
#train_bs: 2
#transform: brownian_bridge
#val_bs: 1
wandb_mode: online
weight_decay: 0.01

# params for the model architecture UNet imagerec
network_G:
  which_model_G: ConditionalUNet
  setting:
    in_nc: 16
    out_nc: 16
    nf: 64
    depth: 4

# params for the dataset imagerec
degradation: # for some synthetic dataset that only have GTs (not deraining example but anyways it is here for now)
  # for denoising
  sigma: 25
  noise_type: G # Gaussian noise: G

  # for super-resolution; here we need to download the dataset from here: https://data.vision.ee.ethz.ch/cvl/DIV2K/
  # they use scale also in testing for deraining and other cases...
  scale: 4

path:
  pretrain_model_G: ~
  strict_load: true
  resume_state: ~

vae_checkpoint_path: /data/cluster/users/belova/projects/sbalign/aligned_diffusion_bridges/imagerec/models/ckpt_step_50000.pt

## for latent diffusion training:
datasets:
  train:
    name: Train_Dataset
    mode: latent_LQGT
    n_workers: 1
    path_to_latents_lq: /data/cluster/users/belova/projects/sbalign/aligned_diffusion_bridges/Rain100H/latents/train/latents_rain.pt
    path_to_latents_gt: /data/cluster/users/belova/projects/sbalign/aligned_diffusion_bridges/Rain100H/latents/train/latents_norain.pt
    batch_size: 8
  val:
    name: Val_Dataset
    mode: latent_LQGT
    path_to_latents_lq: /data/cluster/users/belova/projects/sbalign/aligned_diffusion_bridges/Rain100H/latents/val/latents_rain.pt
    path_to_latents_gt: /data/cluster/users/belova/projects/sbalign/aligned_diffusion_bridges/Rain100H/latents/val/latents_norain.pt